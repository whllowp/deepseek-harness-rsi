# Real-model evolution trajectory: the dual-core RSI evolution composition with
# the scheduled daemon disabled (the trajectory runner drives its own rounds),
# a short benchmark cadence, and the Harmony objective split.
- insert:
    - id: dual-core-rsi-evolution-ledger
      name: '@deepseek-ai/dsh-experimental-dual-core-rsi-evolution/evolution-ledger'
    - id: dual-core-rsi-evolution-world-model
      name: '@deepseek-ai/dsh-experimental-dual-core-rsi-evolution/world-model'
      config:
        window: 5
        minPairs: 3
        errorThreshold: 0.2
    - id: dual-core-rsi-benchmark
      name: '@deepseek-ai/dsh-experimental-dual-core-rsi-evolution/harmony-benchmark'
      config:
        cases:
          - name: runs-tests-before-done
            weight: 2
            requiresGuidance:
              - npm test
          - name: git-status-first
            weight: 1
            requiresGuidance:
              - git status
          - name: changelog-on-release
            weight: 1
            requiresGuidance:
              - CHANGELOG
          - name: concise-policy
            weight: 1
            maxGuidanceChars: 1200
        objectives:
          - name: verification
            weight: 0.75
            cases:
              - runs-tests-before-done
              - git-status-first
              - changelog-on-release
          - name: economy
            weight: 0.25
            cases:
              - concise-policy
    - id: dual-core-rsi-distiller
      name: '@deepseek-ai/dsh-experimental-dual-core-rsi-evolution/replay-distiller'
      config:
        subagentProvider: spawn
        maxLessons: 3
        minSamples: 2
    - id: dual-core-rsi-evolution-trajectory
      name: '@deepseek-ai/dsh-experimental-dual-core-rsi-evolution/trajectory'
      config:
        rounds: 10
    - id: dual-core-rsi
      name: '@deepseek-ai/dsh-experimental-dual-core-rsi'
      config:
        threshold: 0.05
        mergePolicy: auto
        digestMaxSessions: 3
        daemonEnabled: false
    - id: ui-rsi
      name: '@deepseek-ai/dsh-experimental-client-ui-rsi'
      config:
        refreshIntervalMs: 2000
    - id: ui-zelda-pet
      name: '@deepseek-ai/dsh-experimental-client-ui-zelda-pet'
      config:
        refreshIntervalMs: 2000
